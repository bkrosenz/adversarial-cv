[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-cv"
version = "0.1.0"
description = "Grad-CAM-guided targeted adversarial example experiments for torchvision classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "matplotlib>=3.7",
    "mlflow>=2.10",
    "numpy>=1.24",
    "Pillow>=9.5",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
adversarial-cv-run = "adversarial_cv.experiment:main"
adversarial-cv-analyze = "adversarial_cv.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
